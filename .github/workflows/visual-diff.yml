name: visual diff

# Screenshots the PR's code running locally under `wrangler dev`, rather than
# the deployed preview: PR previews sit behind Cloudflare Access, and this keeps
# CI free of Access credentials. Draft branches are skipped because artifacts on
# a public repo are downloadable by any signed-in GitHub user.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: visual-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    if: "!startsWith(github.head_ref, 'blog/') && !startsWith(github.head_ref, 'post/')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install deps
        run: npm ci

      - name: install playwright browsers
        run: npx playwright install chromium

      - name: build static assets
        run: npm run build

      - name: set up local d1
        run: |
          npx wrangler d1 migrations apply kylieis-online-db --local
          npx tsx scripts/seed-db.mjs > /tmp/seed.sql
          npx wrangler d1 execute kylieis-online-db --local --file /tmp/seed.sql

      - name: start wrangler dev
        run: |
          npx wrangler dev --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8787/ && exit 0
            sleep 1
          done
          echo "::error::wrangler dev did not start within 60s"
          cat /tmp/wrangler-dev.log
          exit 1

      - name: screenshot key pages
        run: node scripts/screenshot-pages.mjs http://localhost:8787 screenshots

      - name: upload screenshots
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: post or update comment
        if: always() && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          COUNT=$(ls -1 screenshots/*.png 2>/dev/null | wc -l | tr -d ' ')
          STATUS="captured ${COUNT} screenshots"
          [ "$JOB_STATUS" != "success" ] && STATUS="⚠️ ${STATUS}, some pages failed (see run log)"

          {
            echo "<!-- visual-diff -->"
            echo "## 📸 visual diff"
            echo
            echo "<sup>\`${HEAD_SHA:0:7}\` · ${STATUS} · desktop 1280px + mobile 390px</sup>"
            echo
            echo "pages: \`/\` \`/writing\` \`/speaking\` \`/projects\` \`/about\` \`/now\`"
            echo
            echo "**📦 [download screenshots](${ARTIFACT_URL})** · [workflow run](${RUN_URL})"
          } > /tmp/comment.md

          EXISTING_COMMENT=$(gh api --paginate \
            "/repos/${{ github.repository }}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- visual-diff -->"))) | .id' | head -n 1)

          if [ -n "$EXISTING_COMMENT" ]; then
            gh api -X PATCH "/repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT" \
              -F body=@/tmp/comment.md
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file /tmp/comment.md
          fi
